name: Windows VST3 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --yes
          choco install git --yes

      - name: Clone JUCE
        run: |
          git clone --branch 7.0.5 --depth 1 https://github.com/juce-framework/JUCE.git

      - name: Configure CMake
        run: |
          cmake -S . -B build -DJUCE_DIR="${{ github.workspace }}\JUCE" -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 Plugin
        run: |
          cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: SchranzKick_v0.1_Windows_VST3
          path: build/**/SchranzKick.vst3
